site_author: It
site_description: >-
  Documentación e onboarding del Sector IT

repo_name: Docs
repo_url: https://github.com/GarciaHnos/Docs

theme:
  name: material 
  language: es
  toc: false
  icon:
    repo: fontawesome/brands/github
    search: material/magnify
  custom_dir: material/overrides
  logo: assets/logo-gh-blanco.png
  favicon: assets/logo-gh.png 
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night   # ícono modo oscuro
        name: Cambiar a modo oscuro
    - scheme: slate
      toggle:
        icon: material/weather-sunny  # ícono modo claro
        name: Cambiar a modo claro
  features:
    - navigation.top           # Navbar arriba
    - navigation.tabs          # Opcional: menús como pestañas
    - navigation.tracking      # Resalta en qué sección estás
    - search.highlight         # resalta los términos en los resultados
    - content.code.annotate
    - content.tabs.link 
    - toc.follow

    
    
    
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
      preserve_tabs: true

plugins:
  - search
  - glightbox:
      touchNavigation: true
      zoomable: true



extra_css:
  - assets/styles/menu-oculto.css
  - https://fonts.googleapis.com/icon?family=Material+Icons

extra_javascript:
  - assets/js/menu.js
